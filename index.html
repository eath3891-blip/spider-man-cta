<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Interactive Spider-Man 'Let's Connect' CTA button with realistic biological spider-web physics, audio synthesis, and elastic pulling dynamics.">
  <meta name="theme-color" content="#dc142c">
  <title>Spider-Man &bull; Let's Connect</title>
  <link rel="icon" type="image/png" href="spiderman-logo.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Subtle Web Grid Background on Clean Canvas -->
  <div class="bg-web-grid" aria-hidden="true"></div>

  <!-- Dynamic Web Shooting & Physics Canvas -->
  <canvas id="web-canvas" aria-hidden="true"></canvas>

  <!-- Top Navigation -->
  <header class="top-nav" role="banner">
    <div class="brand-badge" aria-label="Spidey Lab Brand">
      <img src="spiderman-logo.png" alt="Spider-Man Logo" class="brand-spider-logo" width="26" height="26">
      <span>Spidey Lab &bull; Interactive CTA</span>
    </div>

    <div class="top-controls">
      <!-- Audio Toggle -->
      <button id="sound-toggle" class="control-btn active" type="button" aria-label="Toggle Sound Effects" title="Toggle Sound FX">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <span class="sound-label">Sound ON</span>
      </button>
    </div>
  </header>

  <!-- Main Stage / Centered CTA -->
  <main class="stage" role="main">
    
    <!-- CTA 3D Transform Wrapper -->
    <div class="cta-wrapper" id="cta-wrapper">
      
      <!-- Spider-Sense Alert (Appears on proximity) -->
      <div class="spider-sense-banner" id="spider-sense" aria-live="polite">
        <span class="sense-lightning" aria-hidden="true">⚡</span>
        <div class="sense-badge">SPIDER-SENSE TINGLING!</div>
        <span class="sense-lightning" aria-hidden="true">⚡</span>
      </div>

      <!-- The "LET'S CONNECT" Button -->
      <button class="spidey-cta-button" id="spidey-cta" type="button" aria-label="Let's Connect - Spider-Man CTA">
        
        <!-- Realistic 3D Raised Spider-Web Overlay -->
        <div class="button-web-overlay" aria-hidden="true">
          <svg class="button-web-svg" viewBox="0 0 260 70" preserveAspectRatio="none">
            <defs>
              <filter id="web-emboss" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="1.2" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.75"/>
              </filter>
            </defs>
            <g filter="url(#web-emboss)">
              <path d="M130 35 L0 0 M130 35 L35 0 M130 35 L80 0 M130 35 L130 0 M130 35 L180 0 M130 35 L225 0 M130 35 L260 0"/>
              <path d="M130 35 L0 70 M130 35 L35 70 M130 35 L80 70 M130 35 L130 70 M130 35 L180 70 M130 35 L225 70 M130 35 L260 70"/>
              <path d="M130 35 L0 35 M130 35 L260 35"/>
              <path d="M105 35 Q105 22 130 22 Q155 22 155 35 Q155 48 130 48 Q105 48 105 35"/>
              <path d="M78 35 Q78 10 130 10 Q182 10 182 35 Q182 60 130 60 Q78 60 78 35"/>
              <path d="M42 35 Q42 -2 130 -2 Q218 -2 218 35 Q218 72 130 72 Q42 72 42 35"/>
            </g>
          </svg>
        </div>

        <!-- Specular Highlight / Glass Sheen Overlay -->
        <div class="button-gloss-overlay" aria-hidden="true"></div>

        <!-- High-Contrast White Spider-Man Emblem Icon -->
        <div class="spider-emblem" id="spider-emblem" aria-hidden="true">
          <img src="spiderman-logo.png" alt="Spider-Man Chest Emblem" class="spidey-user-logo" id="spidey-logo-img" width="36" height="48">
        </div>

        <!-- CTA Label -->
        <span class="cta-text">LET'S CONNECT</span>

        <!-- Web Burst Origin Node -->
        <div class="web-emitter-glow" aria-hidden="true"></div>

      </button>

    </div>

    <!-- Tension & Radar Status Feedback -->
    <div class="tension-status-container" aria-live="polite">
      <div class="tension-bar-track">
        <div class="tension-bar-fill" id="tension-fill"></div>
      </div>
      <div class="tension-label" id="tension-text">Web Radar Active</div>
    </div>

  </main>

  <!-- Interactive Tethered Reticle -->
  <div class="spidey-reticle" id="spidey-reticle" aria-hidden="true">
    <div class="reticle-ring"></div>
    <div class="reticle-crosshair"></div>
  </div>

  <!-- Connected Popup Modal -->
  <div class="connect-modal-backdrop" id="connect-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-desc">
    <div class="connect-card">
      <div class="card-spidey-accent" aria-hidden="true"></div>
      <button class="modal-close-btn" id="modal-close" type="button" aria-label="Close dialogue">&times;</button>
      
      <div class="modal-badge">Network Caught!</div>
      <h2 class="modal-title" id="modal-title">We're Connected!</h2>
      <p class="modal-desc" id="modal-desc">Your friendly neighborhood developer is ready to collaborate. Reach out through any portal below:</p>

      <nav class="social-links" aria-label="Contact Links">
        <a href="mailto:contact@example.com" class="social-item">
          <div class="social-left">
            <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            <span>Email Me Directly</span>
          </div>
          <span aria-hidden="true">&rarr;</span>
        </a>

        <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="social-item">
          <div class="social-left">
            <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>
            <span>LinkedIn Profile</span>
          </div>
          <span aria-hidden="true">&rarr;</span>
        </a>

        <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="social-item">
          <div class="social-left">
            <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/></svg>
            <span>GitHub Repositories</span>
          </div>
          <span aria-hidden="true">&rarr;</span>
        </a>
      </nav>

    </div>
  </div>

  <!-- Scripts -->
  <script src="audio.js"></script>
  <script src="web-physics.js"></script>
  <script src="main.js"></script>
</body>
</html>
